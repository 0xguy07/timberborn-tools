name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  map-tools:
    name: Generate and validate Practice Valley
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet Pillow pyflakes

      - name: Lint
        run: python -m pyflakes maptools bridge

      - name: Regenerate the map
        run: python maptools/practice_valley_generator.py "/tmp/Practice Valley.timber"

      - name: Validate the regenerated map
        run: python maptools/validate_map.py "/tmp/Practice Valley.timber"

      - name: Validate the committed map
        run: python maptools/validate_map.py "maps/Practice Valley.timber"

      - name: Measure arable land
        run: python maptools/measure_arable.py "maps/Practice Valley.timber"

      - name: Bridge reports a missing save folder cleanly
        env:
          TIMBERBORN_DIR: /tmp/no-saves-here
        run: |
          set +e
          out=$(python bridge/timberborn_mcp.py --selftest 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q "no .timber saves found"

  apidump:
    name: Build apidump and test the mod's protocol code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build apidump
        run: dotnet build tools/apidump -c Release -nologo

      - name: Dump the tool's own assembly as a smoke test
        run: |
          dotnet run --project tools/apidump --no-build -c Release -- tools/apidump/bin/Release/net10.0/apidump.dll | head -20

      - name: Test the mod's JSON and HTTP layers
        run: dotnet run --project mods/BeaverBridge/test -c Release -nologo
